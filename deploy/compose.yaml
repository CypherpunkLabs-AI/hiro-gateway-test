# Replace the placeholder with the immutable digest produced by the reviewed
# Hiro release. The literal digest is part of dstack's measured Compose input.
services:
  hiro-proxy:
    image: ghcr.io/cypherpunklabs-ai/hiro-proxy@sha256:REPLACE_WITH_RELEASE_DIGEST
    ports:
      - "8080:8080"
    environment:
      HIRO_BIND_ADDRESS: 0.0.0.0:8080
      AUTH_ISSUER: ${AUTH_ISSUER:?required}
      AUTH_AUTHORIZED_PARTIES: ${AUTH_AUTHORIZED_PARTIES:?required}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_JWT_KEY: ${AUTH_JWT_KEY:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_JWKS_CACHE_SECONDS: ${AUTH_JWKS_CACHE_SECONDS:-3600}
      DOCUMENT_ROUTER_URL: http://hiro-document-router:8081/v1/convert/file
      DOCUMENT_VISION_BIND: 0.0.0.0:8082
      DOCUMENT_VISION_MODEL: ${DOCUMENT_VISION_MODEL:?required}
      DOCUMENT_VISION_BROKER_TOKEN: ${DOCUMENT_VISION_BROKER_TOKEN:?required}
      DATABASE_URL: ${DATABASE_URL:?required}
      CACHE_NAMESPACE_KEY: ${CACHE_NAMESPACE_KEY:?required}
      INFERENCE_SYSTEM_PROMPT: ${INFERENCE_SYSTEM_PROMPT:?required}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:?required}
      CLOUDFLARE_USAGE_QUEUE_ID: ${CLOUDFLARE_USAGE_QUEUE_ID:?required}
      CLOUDFLARE_QUEUES_API_TOKEN: ${CLOUDFLARE_QUEUES_API_TOKEN:?required}
      USAGE_HMAC_SECRET: ${USAGE_HMAC_SECRET:?required}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
      INFERENCE_TEMPERATURE: ${INFERENCE_TEMPERATURE:-0.7}
      INFERENCE_MAX_TOKENS: ${INFERENCE_MAX_TOKENS:-32000}
      INFERENCE_MAX_CONCURRENCY: ${INFERENCE_MAX_CONCURRENCY:-1000}
      DSTACK_ENDPOINT: /var/run/dstack.sock
      PHALA_ACI_BASE_URL: ${PHALA_ACI_BASE_URL:?required}
      PHALA_API_KEY: ${PHALA_API_KEY:?required}
      PHALA_ACI_ACCEPTED_SUBJECTS: ${PHALA_ACI_ACCEPTED_SUBJECTS:?required}
      PHALA_ACI_ACCEPTED_KMS_ROOT_KEYS: ${PHALA_ACI_ACCEPTED_KMS_ROOT_KEYS:?required}
      PHALA_ACI_PCCS_URL: ${PHALA_ACI_PCCS_URL:-}
      PHALA_ACI_VERIFIER_CACHE_SECONDS: "300"
      PHALA_CONNECT_TIMEOUT_SECONDS: "10"
      PHALA_ATTESTATION_TIMEOUT_SECONDS: "20"
      PHALA_READ_TIMEOUT_SECONDS: "600"
      HIRO_KEYSET_TTL_SECONDS: "2592000"
      HIRO_RECEIPT_TTL_SECONDS: "3600"
      HIRO_SOURCE_REPOSITORY: https://github.com/cypherpunklabs-ai/hiro-proxy
      HIRO_SOURCE_COMMIT: ${HIRO_SOURCE_COMMIT:?required}
      HIRO_IMAGE_DIGEST: ${HIRO_IMAGE_DIGEST:?required}
      RUST_LOG: hiro_proxy=info,private_ai_gateway=info
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock:ro
    networks:
      - default
      - hiro-confidential
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    restart: unless-stopped

networks:
  hiro-confidential:
    internal: true
