name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config perl python3 unzip
      - name: Install pinned Bazel
        run: |
          bash scripts/install-bazel "$RUNNER_TEMP/hiro-bin"
          echo "$RUNNER_TEMP/hiro-bin" >> "$GITHUB_PATH"
      - run: bazel build --config=release --lockfile_mode=error //:hiro-proxy
      - run: bazel test --lockfile_mode=error //:format
      - run: bazel build --lockfile_mode=error //:clippy --@rules_rust//:clippy_flag=-Dwarnings
      - run: bazel test --lockfile_mode=error //:hiro_proxy_tests //:hiro_proxy_bin_tests

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: false
          platforms: linux/amd64
