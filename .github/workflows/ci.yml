name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Restore Bazel downloads and compiled actions
        id: bazel-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/hiro-bazel-repository
            ~/.cache/hiro-bazel-actions
            ~/.cache/bazel/_bazel_runner/*/external
          key: bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock', '.bazelrc') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock', '.bazelrc') }}-
            bazel-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config perl python3 unzip
      - name: Install pinned Bazel
        run: |
          bash scripts/install-bazel "$RUNNER_TEMP/hiro-bin"
          echo "$RUNNER_TEMP/hiro-bin" >> "$GITHUB_PATH"
      - name: Build and check Rust targets together
        run: |
          bazel test --lockfile_mode=error --keep_going \
            --repository_cache="$HOME/.cache/hiro-bazel-repository" \
            --disk_cache="$HOME/.cache/hiro-bazel-actions" \
            --@rules_rust//:clippy_flag=-Dwarnings \
            //:hiro-proxy //:format //:clippy //:hiro_proxy_tests //:hiro_proxy_bin_tests
      - name: Save Bazel cache even when a check fails
        if: ${{ always() && steps.bazel-cache.outcome == 'success' && !cancelled() }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/hiro-bazel-repository
            ~/.cache/hiro-bazel-actions
            ~/.cache/bazel/_bazel_runner/*/external
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

  container-check:
    if: github.event_name == 'pull_request'
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=hiro-proxy

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Image identity
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        id: build
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:build-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=hiro-proxy
          cache-to: type=gha,mode=max,scope=hiro-proxy
      - name: Sign and publish image provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify published provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --signer-digest "$WORKFLOW_COMMIT" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --deny-self-hosted-runners
      - name: Write deployment image metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: python3 scripts/write-image-metadata.py
      - name: Sign deployment metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: metadata
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/images.lock.json
      - name: Collect metadata signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          METADATA_BUNDLE: ${{ steps.metadata.outputs.bundle-path }}
        run: cp -- "$METADATA_BUNDLE" dist/images.lock.sigstore.json
      - name: Publish deployment metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hiro-proxy-image-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
